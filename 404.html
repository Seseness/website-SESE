<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Page not found | SESE</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<style>
  @font-face { font-family: "Todes"; src: url("/project/fonts/Todes-Light.woff2") format("woff2"); font-weight: 300; font-display: swap; }
  :root { --ink:#1A1A1A; --ink2:#4A4A47; --ink3:#7A7770; --sand:#FAF5EC; --blue:#3A7D94; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--sand); color: var(--ink); font-family: "Todes", "Times New Roman", serif; font-weight: 300; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { min-height: 100%; display: grid; grid-template-columns: 1fr 1fr; }
  .txt { padding: 56px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; }
  .wm { font-size: 26px; letter-spacing: .34em; }
  .eb { font-family: "Inter", "Helvetica Neue", system-ui, sans-serif; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--ink3); }
  h1 { font-weight: 300; font-size: 56px; line-height: 1.05; margin: 18px 0 22px; }
  h1 em { color: var(--blue); }
  p { font-style: italic; font-size: 20px; line-height: 1.5; color: var(--ink2); max-width: 440px; margin: 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .btn { display: inline-block; border-radius: 999px; padding: 16px 28px; font-family: "Inter", "Helvetica Neue", system-ui, sans-serif; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; border: 1px solid var(--ink); }
  .btn.dk { background: var(--ink); color: #FFFCF5; }
  .btn:hover { opacity: .85; }
  .pic { background: url("/project/assets/hero-strand.webp") 82% center / cover no-repeat, #B59E80; min-height: 100vh; }
  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; }
    .pic { min-height: 42vh; order: -1; }
    .txt { padding: 28px 20px 44px; gap: 28px; }
    .wm { font-size: 18px; }
    h1 { font-size: 38px; }
    p { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="txt">
    <a class="wm" id="home-logo" href="/">S E S E</a>
    <div>
      <span class="eb">404</span>
      <h1 id="t-title">This page <em>doesn’t exist.</em></h1>
      <p id="t-text">The page you are looking for has moved or no longer exists. Our rituals are still right where you left them.</p>
      <div class="btns">
        <a class="btn dk" id="b-home" href="/">Back to home →</a>
        <a class="btn" id="b-shop" href="/collection.html">Shop all products</a>
      </div>
    </div>
    <span class="eb">sese.be</span>
  </div>
  <div class="pic" role="img" aria-label=""></div>
</div>
<script>
(function () {
  var path = location.pathname;
  var lang = /^\/nl\//.test(path) ? 'nl' : /^\/fr\//.test(path) ? 'fr' : null;
  if (!lang) {
    try { var s = localStorage.getItem('sese_lang_chosen'); if (s === 'nl' || s === 'fr') lang = s; } catch (e) {}
  }
  if (!lang) { var n = (navigator.language || '').slice(0, 2); lang = n === 'nl' ? 'nl' : n === 'fr' ? 'fr' : 'en'; }
  var T = {
    nl: { title: 'Deze pagina <em>bestaat niet.</em>', text: 'De pagina die je zoekt is verplaatst of bestaat niet meer. Onze rituelen staan nog gewoon op hun plek.', home: 'Terug naar home →', shop: 'Bekijk alle producten', doc: 'Pagina niet gevonden | SESE', pre: '/nl/' },
    fr: { title: 'Cette page <em>n’existe pas.</em>', text: 'La page que vous cherchez a été déplacée ou n’existe plus. Nos rituels, eux, sont toujours là.', home: 'Retour à l’accueil →', shop: 'Voir tous les produits', doc: 'Page introuvable | SESE', pre: '/fr/' }
  };
  var t = T[lang];
  if (!t) return;
  document.documentElement.lang = lang;
  document.title = t.doc;
  document.getElementById('t-title').innerHTML = t.title;
  document.getElementById('t-text').textContent = t.text;
  var h = document.getElementById('b-home'); h.textContent = t.home; h.href = t.pre;
  var s2 = document.getElementById('b-shop'); s2.textContent = t.shop; s2.href = t.pre + 'collection.html';
  document.getElementById('home-logo').href = t.pre;
})();
</script>
</body>
</html>
