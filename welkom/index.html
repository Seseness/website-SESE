<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SESE - Welkom</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAF5EC;color:#1A1A1A;font-family:Georgia,serif;letter-spacing:.3em}</style>
<script>
  // Welcome link used in the newsletter welcome email: saves the welcome
  // code so the cart sends it to checkout (sese-cart.js / cart.html), then
  // continues to the homepage in the visitor's language.
  try { localStorage.setItem('sese_discount_code', 'SESE2026'); } catch (e) {}
  var l = (navigator.language || 'en').toLowerCase();
  var dest = l.indexOf('nl') === 0 ? '/nl/' : l.indexOf('fr') === 0 ? '/fr/' : '/';
  location.replace(dest);
</script>
</head>
<body>S E S E</body>
</html>
